[package]
name = "db"
version = "0.1.0"
edition = "2021"

# Standalone until the root workspace assembles (build order: crates first, workspace later).
[workspace]

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ulid = "1"
tokio = { version = "1", features = ["sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
# Tests poke user_version directly to simulate schema skew.
rusqlite = { version = "0.31", features = ["bundled"] }
