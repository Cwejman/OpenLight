[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
db = { path = "../db" }
engine = { path = "../engine" }
tao = "0.30"
# `transparent` is *not* in wry's default feature set: without it
# `with_transparent(true)` is silently a no-op and every webview paints an
# opaque base over the window's canvas (host.md §Visual Language wants tiles
# as cards *on* the background, and the sidebar naked on it).
wry = { version = "0.47", features = ["transparent"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mount declarations live in .ol/project.toml (pilot.md, Multi-project mounts).
toml = "0.8"
# host.md boot step 1: the runtime the engine and its providers need. wry's IPC
# callback hands parsed work here rather than blocking on it.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
# The rim drinks the active db's commit broadcast for relayout (main.rs, the
# reactivity seam) — the same stream engine's reactivity task consumes.
tokio-stream = "0.1"

# The frame's chrome is AppKit's: the window's canvas is set on NSWindow
# directly (tao 0.30's colour signature cannot express a gray), and a tile's
# aura is hung on its webview's CoreAnimation layer — a shadow no webview can
# clip. See `paint_canvas` and `cast_aura` in main.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# CGPoint/CGSize/CGRect with their objc encodings — the shadow path's argument.
objc2-foundation = "0.2"
