[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
tao = "0.30"
wry = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# host.md boot step 1: the runtime the engine and its providers need. wry's IPC
# callback hands parsed work here rather than blocking on it.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
