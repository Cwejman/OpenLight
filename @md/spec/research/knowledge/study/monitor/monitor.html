<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The making</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark;
    --bg:#f4efe6; --paper:#fbf8f2; --ink:#221f1b; --mute:#7a7267; --line:#e4dccd;
    --live:#2f8f62; --rest:#b9b0a2; --accent:#b8542a; --cool:#3d6fb0; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#141317; --paper:#1c1b21; --ink:#ebe6dc; --mute:#948d82; --line:#2e2c34;
    --live:#5ccf93; --rest:#5a564f; --accent:#e58a5a; --cool:#7ea6e6; } }
  body { margin:0; padding:28px 20px 60px; background:var(--bg); color:var(--ink);
    font: 15px/1.55 "Newsreader", Georgia, serif; }
  .head { max-width:920px; margin:0 auto 28px; }
  .head h1 { font: 500 30px/1.15 "Newsreader", Georgia, serif; margin:0 0 6px; letter-spacing:-0.01em; }
  .head .now { font: 13px/1.5 "Inter", system-ui, sans-serif; color:var(--mute); }
  .standing { max-width:920px; margin:0 auto 34px; padding:18px 22px; background:var(--paper);
    border-left:3px solid var(--live); border-radius:0 8px 8px 0; font-size:16px; }
  .standing .lbl, .lbl { font: 500 11px/1 "Inter", system-ui, sans-serif; letter-spacing:.12em;
    text-transform:uppercase; color:var(--mute); display:block; margin-bottom:8px; }
  .rounds { max-width:920px; margin:0 auto 40px; display:flex; flex-wrap:wrap; gap:8px 18px;
    font: 13px/1.4 "Inter", system-ui, sans-serif; color:var(--mute); }
  .rounds span.now { color:var(--live); }
  .rounds span::before { content:"◦ "; } .rounds span.now::before { content:"● "; }
  .session { max-width:920px; margin:0 auto 46px; }
  .session .who { display:flex; align-items:baseline; gap:12px; font: 13px/1.4 "Inter", system-ui, sans-serif;
    color:var(--mute); margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .session .who b { color:var(--ink); font-weight:500; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--rest); display:inline-block; position:relative; top:-1px; }
  .dot.live { background:var(--live); animation:breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--live) 22%, transparent); } }
  .story { display:grid; grid-template-columns: 56px 1fr; column-gap:16px; row-gap:0; }
  .t { font: 12px/1.6 "Inter", system-ui, sans-serif; color:var(--mute); text-align:right; padding-top:3px;
    font-variant-numeric: tabular-nums; }
  .ev { padding: 3px 0 14px; border-left:1px solid var(--line); padding-left:18px; margin-left:0; position:relative; }
  .ev::before { content:""; position:absolute; left:-4px; top:10px; width:7px; height:7px; border-radius:50%;
    background:var(--line); }
  .ev.say::before { background:var(--ink); } .ev.report::before { background:var(--cool); }
  .ev.spawn::before { background:var(--accent); } .ev.write::before { background:var(--live); }
  .ev .s { font: 12.5px/1.4 "Inter", system-ui, sans-serif; color:var(--mute); }
  .ev.write .s, .ev.spawn .s { color:var(--ink); }
  .ev .q { margin-top:4px; white-space:pre-wrap; }
  .ev.say .q { font-size:16.5px; }
  .ev.report .q { color:var(--ink); border-left:2px solid var(--cool); padding-left:12px; font-size:14.5px; }
  .ev.spawn .q { font-style:italic; color:var(--mute); font-size:14px; }
  .ev.write .q { font-size:14px; color:var(--ink); opacity:.9; }
  .ev.act { padding-bottom:6px; } .ev.act .s { font-size:12px; }
  .foot { font: 12px/1.6 "Inter", system-ui, sans-serif; color:var(--mute); margin-top:6px; }
  .rest { opacity:.72; }
  details summary { cursor:pointer; font: 13px/1.4 "Inter", system-ui, sans-serif; color:var(--mute); list-style:none; }
  details summary::-webkit-details-marker { display:none; }
</style>
</head>
<body>
<div class="head"><h1>The making</h1><div class="now" id="now">connecting…</div></div>
<div id="standing"></div>
<div class="rounds" id="rounds"></div>
<div id="sessions"></div>
<script>
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hm = t => t ? t.slice(11,16) : '';
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? Math.round(n/1e3)+'k' : String(n);
function story(a, hero) {
  // collapse runs of plain actions so the words carry the page
  const evs = a.events.slice(hero ? -120 : -30);
  let out = '', run = [];
  const flush = () => { if (run.length) { out += `<div class="t"></div><div class="ev act"><span class="s">${run.map(esc).join(' · ')}</span></div>`; run = []; } };
  for (const e of evs) {
    if (e.k === 'act') { run.push(e.s); continue; }
    flush();
    out += `<div class="t">${hm(e.t)}</div><div class="ev ${e.k}">${e.s ? `<span class="s">${esc(e.s)}</span>` : ''}${e.q ? `<div class="q">${esc(e.q)}</div>` : ''}</div>`;
  }
  flush();
  return out;
}
function session(a, hero) {
  const cls = a.active ? 'live' : '';
  const state = a.active ? 'working now' : `rested ${Math.round(a.idle_s/60)} min ago`;
  const body = `<div class="story">${story(a, hero)}</div>
    <div class="foot">${a.messages} turns · ${fmt(a.output)} words out · ${fmt(a.cache_r)} read from cache · ≈${a.eq_m}M</div>`;
  return `<section class="session ${hero ? '' : 'rest'}">
    <div class="who"><span class="dot ${cls}"></span><b>${esc(a.model||'')}</b><span>${a.id.slice(0,9)}</span>
      <span>${hm(a.first)}–${hm(a.last)}</span><span>${state}</span>${a.children.length ? `<span>· sent ${a.children.length} fresh head${a.children.length>1?'s':''}</span>` : ''}</div>
    ${hero ? body : `<details><summary>show</summary>${body}</details>`}</section>`;
}
async function tick() {
  try {
    const s = await (await fetch('/state')).json();
    const d = s.debrief || {};
    document.getElementById('now').textContent = `${s.updated} · ${s.agents.filter(a=>a.active).length} working · ${s.agents.length} sessions in the record`;
    document.getElementById('standing').innerHTML = d.standing ? `<div class="standing"><span class="lbl">where it stands</span>${esc(d.standing)}</div>` : '';
    document.getElementById('rounds').innerHTML = (d.rounds||[]).map((r,i,arr)=>`<span class="${i===arr.length-1?'now':''}">${esc(r)}</span>`).join('');
    const ag = s.agents.slice().sort((x,y)=> (y.active-x.active) || ((y.last||'').localeCompare(x.last||'')));
    document.getElementById('sessions').innerHTML = ag.map((a,i)=>session(a, i===0 || a.active)).join('');
  } catch (e) { document.getElementById('now').textContent = 'monitor unreachable: ' + e; }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
