<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark;
    --bg:#f2ede3; --paper:#fbf8f2; --ink:#1e1b17; --soft:#4a443c; --mute:#857d71; --line:#e0d7c7;
    --rule:#cfc4b0; --seq:#3d6fb0; --warm:#b8542a; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#141317; --paper:#1b1a20; --ink:#efeae0; --soft:#cbc4b8; --mute:#8f887d; --line:#2c2a32;
    --rule:#3a3742; --seq:#6a9be0; --warm:#e58a5a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font: 17px/1.62 "Newsreader", Georgia, serif; -webkit-font-smoothing:antialiased; }
  .wrap { display:grid; grid-template-columns: 360px 1fr; min-height:100vh; }
  @media (max-width: 900px) { .wrap { grid-template-columns:1fr; } .map { position:static !important; height:auto !important; border-right:0; border-bottom:1px solid var(--rule); } }

  /* the map */
  .map { position:sticky; top:0; height:100vh; padding:28px 24px 22px; display:flex; flex-direction:column;
    border-right:1px solid var(--rule); background:var(--paper); overflow:hidden; }
  h1.root { font: 600 20px/1.22 "Newsreader", serif; margin:0 0 3px; letter-spacing:-.012em; }
  .sub { font: 12px/1.5 "Inter", system-ui, sans-serif; color:var(--mute); margin-bottom:22px;
    letter-spacing:.01em; }
  .lbl { font: 500 10px/1 "Inter", system-ui, sans-serif; letter-spacing:.15em;
    text-transform:uppercase; color:var(--mute); display:block; margin:0 0 12px; }
  svg { display:block; width:100%; height:auto; }
  svg path { cursor:pointer; transition:opacity .12s; }
  svg path:hover { opacity:.7; }
  .gauge { margin:24px 0 0; }
  .gauge .bar { display:flex; height:20px; border-radius:3px; overflow:hidden; background:var(--line); }
  .gauge .bar i { display:block; border-right:2px solid var(--paper); }
  .gauge table { width:100%; border-collapse:collapse; font: 12.5px/1.75 "Inter", system-ui, sans-serif; margin-top:10px; }
  .gauge td { padding:1px 0; color:var(--mute); }
  .gauge td.n { text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
  .gauge td.c { text-align:right; font-variant-numeric:tabular-nums; }
  .gauge i.sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:8px; vertical-align:-1px; }
  .note { font: 11.5px/1.6 "Inter", system-ui, sans-serif; color:var(--mute); margin-top:8px; }

  /* the page */
  .doc { padding:56px 44px 120px; max-width:820px; }
  .crumb { font: 12px/1.7 "Inter", system-ui, sans-serif; color:var(--mute); margin-bottom:26px;
    letter-spacing:.04em; text-transform:uppercase; }
  .crumb a { color:var(--soft); text-decoration:none; cursor:pointer; border-bottom:1px solid var(--line); }
  .crumb a:hover { color:var(--seq); border-color:var(--seq); }
  .crumb span.sep { border:0; margin:0 7px; color:var(--rule); }
  h2.title { font: 600 42px/1.12 "Newsreader", serif; margin:0 0 14px; letter-spacing:-.02em; max-width:16em; }
  .meta { font: 11.5px/1.6 "Inter", system-ui, sans-serif; color:var(--mute);
    letter-spacing:.08em; text-transform:uppercase; padding-bottom:18px;
    border-bottom:1px solid var(--rule); margin-bottom:30px; }

  .prose { max-width:34em; }
  .prose > p:first-child { font-size:20.5px; line-height:1.54; color:var(--ink); margin-bottom:1.2em; }
  .prose p { margin:0 0 1.1em; color:var(--soft); }
  .prose h3 { font: 600 25px/1.25 "Newsreader", serif; color:var(--ink);
    margin:2.2em 0 .55em; letter-spacing:-.012em; padding-top:.5em; border-top:1px solid var(--line); }
  .prose h4 { font: 500 13px/1.4 "Inter", system-ui, sans-serif; color:var(--mute);
    letter-spacing:.13em; text-transform:uppercase; margin:1.9em 0 .6em; }
  .prose ul, .prose ol { margin:0 0 1.15em; padding-left:1.15em; color:var(--soft); }
  .prose li { margin:0 0 .62em; padding-left:.15em; }
  .prose strong { font-weight:600; color:var(--ink); }
  .prose em { font-style:italic; }
  .prose code { font: 14px/1.4 ui-monospace, Menlo, monospace; background:var(--paper);
    border:1px solid var(--line); border-radius:3px; padding:0 4px; }
  .prose pre { background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:14px 16px; overflow-x:auto; font: 13px/1.55 ui-monospace, Menlo, monospace; }
  .prose blockquote { margin:1.4em 0; padding-left:18px; border-left:2px solid var(--rule);
    color:var(--mute); font-style:italic; }
  .prose a { color:var(--seq); text-decoration:none; border-bottom:1px solid color-mix(in oklab, var(--seq) 35%, transparent); }
  .prose a.empty { color:var(--mute); border-bottom:1px dotted var(--rule); }

  /* the minimap: the whole holarchy as the text it is */
  .miniwrap { flex:1 1 auto; position:relative; overflow:hidden; margin-top:20px; min-height:120px; }
  .mini { position:absolute; inset:0 0 auto 0; transform-origin:top left; }
  .cursor { position:absolute; left:-6px; right:-4px; border:1px solid var(--warm); border-radius:3px;
    background:color-mix(in oklab, var(--warm) 9%, transparent); pointer-events:none; }
  .caret { position:absolute; left:-6px; right:-4px; height:2px; background:var(--warm); pointer-events:none; }
  .mn { padding:0 0 7px; cursor:pointer; border-left:2px solid transparent; }
  .mn:hover { border-left-color:var(--rule); background:color-mix(in oklab, var(--ink) 3%, transparent); }
  .mn.here { border-left-color:var(--warm); }
  .mh { height:3px; border-radius:1.5px; margin:0 0 3px; }
  .mp { margin:0 0 2.5px; }
  .mp .ln { height:1px; margin-bottom:1px; border-radius:.5px; }
  .mp.big .ln { background:color-mix(in oklab, var(--warm) 62%, var(--bg)) !important; }
  .kids .grp { font: 500 10px/1 "Inter", system-ui, sans-serif; letter-spacing:.15em;
    text-transform:uppercase; color:var(--mute); display:block; margin:34px 0 0; padding-top:10px;
    border-top:2px solid var(--ink); }
  .kids .grp.second { border-top-width:1px; border-top-color:var(--rule); }
  .rooms { margin:12px 0 0 2px; padding-left:16px; border-left:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:3px 18px; }
  .room { font: 14.5px/1.5 "Newsreader", serif; color:var(--mute); white-space:nowrap; }
  .room b { font-weight:400; color:var(--soft); }
  .room i { font-style:normal; font: 11px/1 "Inter", system-ui, sans-serif; color:var(--mute);
    margin-left:6px; font-variant-numeric:tabular-nums; }
  .room.deep b { color:var(--ink); }
  .room.deep::before { content:"›"; color:var(--rule); margin-right:5px; }
  .pagemap { position:absolute; inset:0; }
  .pagemap i { position:absolute; display:block; border-radius:1px; }
  .view { position:absolute; left:-6px; right:-4px; border:1px solid var(--warm); border-radius:3px;
    background:color-mix(in oklab, var(--warm) 10%, transparent); pointer-events:none; }
  .mn.read { opacity:.42; }
  .mn.changed { border-left-color:var(--warm) !important; }
  .mn.changed .mh { background:var(--warm) !important; }
  .unread { font: 11.5px/1.6 "Inter", system-ui, sans-serif; color:var(--mute); margin:6px 0 0;
    letter-spacing:.05em; }
  .unread b { color:var(--warm); font-weight:500; }
  /* the texture: how heavy a brief looks before it is read */
  .tex { display:flex; gap:2px; align-items:flex-end; height:16px; margin:8px 0 0; }
  .tex i { display:block; width:3px; border-radius:1px; background:var(--rule); }
  .tex i.big { background:var(--warm); }
  .kw .tex { justify-content:flex-end; height:13px; margin:7px 0 4px; }
  .weigh { display:flex; align-items:center; gap:14px; margin:-8px 0 26px;
    font: 11.5px/1.6 "Inter", system-ui, sans-serif; color:var(--mute);
    letter-spacing:.06em; text-transform:uppercase; }
  .weigh .tex { height:20px; margin:0; }
  .backs { margin-top:42px; padding-top:14px; border-top:1px solid var(--line); }
  .backs a { display:inline-block; font: 15px/1.5 "Newsreader", serif; color:var(--soft);
    margin:0 18px 6px 0; cursor:pointer; border-bottom:1px solid var(--line); }
  .backs a:hover { color:var(--seq); border-color:var(--seq); }
  /* what lies beneath */
  .kids { margin-top:64px; }
  .kids .lbl { border-top:2px solid var(--ink); padding-top:10px; margin-bottom:4px; }
  .kid { display:grid; grid-template-columns:minmax(0,1fr) 108px; gap:26px; align-items:baseline;
    padding:22px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .kid > div { min-width:0; }
  .kid:hover .kn { color:var(--seq); }
  .kn { font: 600 21px/1.25 "Newsreader", serif; letter-spacing:-.01em; transition:color .12s; }
  .kf { color:var(--mute); font-size:16px; line-height:1.5; margin-top:5px; max-width:36em; }
  .kw { font: 11.5px/1.5 "Inter", system-ui, sans-serif; color:var(--mute); text-align:right;
    letter-spacing:.06em; text-transform:uppercase; }
  .kw .o { display:block; font-size:15px; letter-spacing:0; text-transform:none;
    color:var(--ink); font-variant-numeric:tabular-nums; font-family:"Newsreader",serif; }
  .kw .b { height:3px; border-radius:2px; background:var(--line); margin:7px 0 5px; overflow:hidden; }
  .kw .b i { display:block; height:100%; background:var(--seq); }
</style>
</head>
<body>
<div class="wrap">
  <aside class="map">
    <h1 class="root" id="rootname">reading…</h1>
    <div class="sub" id="rootsub"></div>
    <div id="sun"></div>
    <div class="gauge" id="gauge"></div>
    <span class="lbl" style="margin-top:18px;margin-bottom:0">the whole, as the text it is</span>
    <div class="unread" id="unread"></div>
    <div class="miniwrap"><div class="mini" data-grade="whole"></div>
      <div class="cursor" hidden></div><div class="caret" hidden></div></div>
    <span class="lbl" id="nearlbl" style="margin-top:16px;margin-bottom:0">this page, as you scroll it</span>
    <div class="miniwrap" id="pagewrap"><div class="pagemap" id="pagemap"></div>
      <div class="view" id="view" hidden></div></div>
  </aside>
  <main class="doc">
    <div class="crumb" id="crumb"></div>
    <h2 class="title" id="title"></h2>
    <div class="meta" id="meta"></div>
    <div class="weigh" id="weigh"></div>
    <div class="prose" id="prose"></div>
    <div class="backs" id="backs"></div>
    <div class="kids" id="kids"></div>
  </main>
</div>
<script>
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tok = n => Math.round(n/4);
const fmt = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1)+'k' : String(n);
const shade = d => `color-mix(in oklab, var(--seq) ${Math.max(16, 96 - d*20)}%, var(--bg))`;
let DATA = null, PATH = [];   // PATH = indices from the root to the focused node

function at(path) { let n = DATA.tree; for (const i of path) n = n.kids[i]; return n; }
function md(src) {
  const lines = (src||'').split('\n'); let out = '', buf = [], list = null;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]*)\)/g, (m,a,b) => b ? `<a href="${esc(b)}" target="_blank" rel="noopener">${a}</a>` : `<a class="empty">${a}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const flushP = () => { if (buf.length) { out += `<p>${inline(buf.join(' '))}</p>`; buf = []; } };
  const flushL = () => { if (list) { out += `</${list}>`; list = null; } };
  let code = false;
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (l.startsWith('```')) { flushP(); flushL(); out += code ? '</code></pre>' : '<pre><code>'; code = !code; continue; }
    if (code) { out += esc(raw) + '\n'; continue; }
    if (!l.trim()) { flushP(); flushL(); continue; }
    let m;
    if ((m = l.match(/^(#{3,6})\s+(.*)$/))) { flushP(); flushL(); const h = Math.min(m[1].length, 4); out += `<h${h}>${inline(m[2])}</h${h}>`; continue; }
    if ((m = l.match(/^[-*]\s+(.*)$/))) { flushP(); if (list !== 'ul') { flushL(); out += '<ul>'; list='ul'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\d+\.\s+(.*)$/))) { flushP(); if (list !== 'ol') { flushL(); out += '<ol>'; list='ol'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^>\s?(.*)$/))) { flushP(); flushL(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    buf.push(l);
  }
  flushP(); flushL(); if (code) out += '</code></pre>';
  return out;
}

function index(root) {
  const byPath = {}, byKey = {};
  (function w(n){ if ((n.kind === 'file' || n.kind === 'folder') && !byPath[n.path]) byPath[n.path] = n;
    if (n.anchor) byKey[n.path + '#' + n.anchor] = n; n.kids.forEach(w); })(root);
  return {byPath, byKey};
}
function sunburst(focus) {
  const deep = (function d(n){ return n.kids.length ? 1 + Math.max(...n.kids.map(d)) : 0; })(focus);
  const RINGS = Math.max(1, Math.min(7, deep)), R0 = 34, RING = Math.max(16, Math.min(30, 150 / RINGS));
  const S = (R0 + RINGS*RING + 6) * 2, c = S/2;
  const arc = (r0, r1, a0, a1) => {
    if (a1 - a0 > 6.2829) a1 = a0 + 6.2829;
    const p = (r,a) => [c + r*Math.cos(a), c + r*Math.sin(a)];
    const [x0,y0]=p(r0,a0),[x1,y1]=p(r1,a0),[x2,y2]=p(r1,a1),[x3,y3]=p(r0,a1);
    const big = a1-a0 > Math.PI ? 1 : 0;
    return `M${x0},${y0}L${x1},${y1}A${r1},${r1} 0 ${big} 1 ${x2},${y2}L${x3},${y3}A${r0},${r0} 0 ${big} 0 ${x0},${y0}Z`;
  };
  let out = '', placed = new Map(), IDX = index(focus);
  const walk = (n, depth, a0, a1, path) => {
    if (depth > RINGS || a1 - a0 < 0.003) return;
    if (depth > 0) {
      const r0 = R0 + (depth-1)*RING, r1 = r0 + RING - Math.min(2, RING/8);
      const own = n.total_n ? Math.max(0.08, n.own_n / n.total_n) : 1;
      out += `<path d="${arc(r0, r1, a0, a1)}" fill="${shade(depth)}" stroke="var(--paper)" stroke-width="1.5"
        data-path="${path.join(',')}"><title>${esc(n.name)} — ${fmt(tok(n.own_n))} own, ${fmt(tok(n.total_n))} with everything beneath</title></path>`;
      out += `<path d="${arc(r0, r0 + (RING-2)*own, a0, a1)}" fill="var(--ink)" fill-opacity=".14" pointer-events="none"/>`;
      placed.set(n, {r: (r0+r1)/2, a: (a0+a1)/2});
    }
    let s = a0;
    const tot = n.kids.reduce((a,k)=>a+Math.max(k.total_n, 1), 0) || 1;
    for (let i=0;i<n.kids.length;i++) {
      const k = n.kids[i], w = (a1-a0) * Math.max(k.total_n,1)/tot;
      walk(k, depth+1, s, s+w, path.concat(i)); s += w;
    }
  };
  walk(focus, 0, -Math.PI/2, 1.5*Math.PI, []);
  let chords = '';
  for (const [n, from] of placed) {
    for (const l of (n.links || [])) {
      const t = IDX.byKey[l] || IDX.byPath[l.split('#')[0]];
      const to = t && placed.get(t);
      if (!to || t === n) continue;
      const pt = (r,a) => [c + r*Math.cos(a), c + r*Math.sin(a)];
      const [x1,y1] = pt(from.r, from.a), [x2,y2] = pt(to.r, to.a);
      chords += `<path d="M${x1},${y1} Q${c},${c} ${x2},${y2}" fill="none" stroke="var(--warm)"
        stroke-width=".8" stroke-opacity=".5" pointer-events="none"/>`;
    }
  }
  return `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="The holarchy, each arc weighted by the text beneath it">
    <circle cx="${c}" cy="${c}" r="${R0-4}" fill="${shade(0)}" stroke="var(--paper)" stroke-width="2"/>
    <text x="${c}" y="${c}" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif"
      font-size="11" fill="var(--ink)">${fmt(tok(focus.total_n))}</text>${out}${chords}</svg>`;
}

function gauge(focus) {
  const acc = {}; (function w(n,d){ acc[d]=(acc[d]||0)+n.own_n; n.kids.forEach(k=>w(k,d+1)); })(focus,0);
  const ds = Object.keys(acc).map(Number).sort((a,b)=>a-b);
  const total = ds.reduce((a,d)=>a+acc[d],0) || 1;
  let cum = 0;
  const bar = ds.map(d => `<i style="width:${100*acc[d]/total}%;background:${shade(d)}" title="level ${d}"></i>`).join('');
  const rows = ds.map(d => { cum += acc[d]; return `<tr>
      <td><i class="sw" style="background:${shade(d)}"></i>${d === 0 ? 'this room' : d + ' room' + (d>1?'s':'') + ' in'}</td>
      <td class="n">${fmt(tok(acc[d]))}</td>
      <td class="c">${fmt(tok(cum))} to here</td></tr>`; }).join('');
  return `<span class="lbl">what stopping at each level costs</span>
    <div class="bar">${bar}</div><table>${rows}</table>
    <div class="note">tokens, counted as bytes over four</div>`;
}

function texture(paras, cap) {
  if (!paras || !paras.length) return '';
  const max = Math.max(600, ...paras), show = cap ? paras.slice(0, cap) : paras;
  return `<div class="tex">` + show.map(n =>
    `<i class="${n > 500 ? 'big' : ''}" style="height:${Math.max(2, Math.round(16*n/max))}px" title="${n} characters"></i>`
  ).join('') + `</div>`;
}
const SEEN = (() => { try { return JSON.parse(localStorage.getItem('reader.seen') || '{}'); } catch (e) { return {}; } })();
function saveSeen() { try { localStorage.setItem('reader.seen', JSON.stringify(SEEN)); } catch (e) {} }
function trait(n) { const was = SEEN[n.id]; return was === undefined ? '' : (was === n.h ? 'read' : 'changed'); }
function unreadCount(root) {
  let unread = 0, changed = 0;
  (function w(n) { const t = trait(n); if (t === '') unread++; else if (t === 'changed') changed++; n.kids.forEach(w); })(root);
  return {unread, changed};
}
function pathOf(target) {
  let found = null;
  (function w(n, p) { if (found) return; if (n === target) { found = p; return; } n.kids.forEach((k,i)=>w(k,p.concat(i))); })(DATA.tree, []);
  return found;
}
function resolve(href, fromPath) {
  if (!href || /^(https?:|mailto:|www\.)/.test(href)) return null;
  const [tgt, anc] = href.split('#');
  const base = (fromPath || '').split('/').slice(0, -1);
  const segs = tgt ? base.concat(tgt.split('/')) : (fromPath || '').split('/');
  const out = [];
  for (const sg of segs) { if (!sg || sg === '.') continue; if (sg === '..') out.pop(); else out.push(sg); }
  const p = out.join('/'), IDX = index(DATA.tree);
  return (anc && IDX.byKey[p + '#' + anc]) || IDX.byPath[p] || null;
}
function pointedFrom(focus) {
  const IDX = index(DATA.tree), out = [];
  (function w(n) {
    if (n !== focus && (n.links || []).some(l => (IDX.byKey[l] || IDX.byPath[l.split('#')[0]]) === focus)) out.push(n);
    n.kids.forEach(w);
  })(DATA.tree);
  return out;
}
function go(path, push) {
  PATH = path;
  if (push !== false) history.pushState({path}, '', '#' + path.join('.'));
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => { PATH = (e.state && e.state.path) || []; render(); });
function flat(n, depth, path, out) {
  out.push({n, depth, path});
  n.kids.forEach((k,i) => flat(k, depth+1, path.concat(i), out));
  return out;
}
function minimap(root, here, cap) {
  const CPL = 78, W = 286;
  const all = flat(root, 0, [], []).filter(x => cap === undefined || x.depth <= cap);
  return all.map(({n, depth, path}) => {
    const ind = Math.min(depth, 8) * 8, w = W - ind, col = shade(depth);
    const hw = Math.max(14, Math.min(w, 20 + (n.name||'').length * 3.1));
    const paras = (n.paras||[]).map(len => {
      const full = Math.floor(len / CPL), last = (len % CPL) / CPL;
      let ln = '';
      for (let i=0;i<Math.min(full, 40);i++) ln += `<div class="ln" style="width:${w}px;background:${col}"></div>`;
      if (last > 0.04) ln += `<div class="ln" style="width:${Math.round(w*last)}px;background:${col}"></div>`;
      return `<div class="mp ${len > 500 ? 'big' : ''}">${ln}</div>`;
    }).join('');
    const on = path.join(',') === here.join(',');
    const space = Math.max(0, (4 - Math.min(depth,4)) * 7);
    return `<div class="mn ${on ? 'here' : ''} ${trait(n)}" data-path="${path.join(',')}" style="margin-left:${ind}px;margin-top:${space}px" title="${esc(n.name)} — ${fmt(tok(n.own_n))} tokens">
      <div class="mh" style="width:${hw}px;background:${col}"></div>${paras}</div>`;
  }).join('');
}
function pagemap() {
  const wrap = document.getElementById('pagewrap'), inner = document.getElementById('pagemap');
  const doc = document.querySelector('.doc');
  if (!wrap || !doc) return;
  const H = Math.max(1, document.documentElement.scrollHeight), k = wrap.clientHeight / H, W = 286;
  const parts = [];
  doc.querySelectorAll('.crumb, .title, .meta, .prose > *, .kids > .grp, .kids > .kid').forEach(el => {
    const r = el.getBoundingClientRect();
    const top = (r.top + window.scrollY) * k, h = Math.max(1, r.height * k);
    const tag = el.tagName.toLowerCase(), cls = el.className || '';
    let w = W, c = 'var(--seq)', o = .5, x = 0;
    if (cls.includes('kid')) { w = W - 12; x = 12; c = 'var(--ink)'; o = .16; }
    else if (cls.includes('grp') || tag === 'h3') { w = W * .55; c = 'var(--ink)'; o = .62; }
    else if (tag === 'h4' || cls.includes('meta') || cls.includes('crumb')) { w = W * .38; o = .3; }
    else if (cls.includes('title')) { w = W * .78; c = 'var(--ink)'; o = .8; }
    else if (tag === 'pre' || tag === 'blockquote') { w = W - 14; x = 14; o = .34; }
    parts.push(`<i style="top:${top}px;height:${h}px;left:${x}px;width:${w}px;background:${c};opacity:${o}"></i>`);
  });
  inner.innerHTML = parts.join('');
  const view = document.getElementById('view');
  view.hidden = false;
  view.style.top = (window.scrollY * k) + 'px';
  view.style.height = Math.max(3, window.innerHeight * k) + 'px';
}
function fit() {
  document.querySelectorAll('.miniwrap').forEach(wrap => {
    const inner = wrap.querySelector('.mini');
    if (!inner) return;
    inner.style.transform = 'none';
    const nat = inner.scrollHeight, avail = wrap.clientHeight;
    const k = nat ? Math.min(1, avail / nat) : 1;
    inner.style.transform = `scaleY(${k})`;
    inner.dataset.k = k;
  });
  cursor();
}
function cursor() {
  const doc = document.querySelector('.doc');
  const span = Math.max(1, doc.scrollHeight - window.innerHeight);
  const f = Math.min(1, Math.max(0, window.scrollY / span));
  document.querySelectorAll('.miniwrap').forEach(wrap => {
    const inner = wrap.querySelector('.mini'), cur = wrap.querySelector('.cursor'), car = wrap.querySelector('.caret');
    if (!inner || !cur || !car) return;
    const k = Number(inner.dataset.k || 1), el = inner.querySelector('.mn.here');
    if (!el) { cur.hidden = car.hidden = true; return; }
    const top = el.offsetTop * k, h = Math.max(3, el.offsetHeight * k);
    cur.hidden = false; cur.style.top = top + 'px'; cur.style.height = h + 'px';
    car.hidden = false; car.style.top = (top + f * h) + 'px';
  });
}
window.addEventListener('scroll', () => { cursor(); pagemap(); }, {passive:true});
window.addEventListener('resize', () => { fit(); pagemap(); });
function render() {
  const focus = at(PATH), root = DATA.tree;
  document.getElementById('rootname').textContent = root.name;
  document.getElementById('rootsub').textContent =
    `${fmt(tok(root.total_n))} tokens in ${(function c(n){return 1+n.kids.reduce((a,k)=>a+c(k),0);})(root)} briefs`;
  document.getElementById('sun').innerHTML = focus.kids.length ? sunburst(focus) : '';
  document.getElementById('gauge').innerHTML = gauge(focus);
  SEEN[focus.id] = focus.h; saveSeen();
  document.querySelector('[data-grade="whole"]').innerHTML = minimap(root, PATH);
  const u = unreadCount(root);
  document.getElementById('unread').innerHTML = u.unread || u.changed
    ? `${u.unread ? `<b>${u.unread}</b> not read yet` : ''}${u.unread && u.changed ? ' · ' : ''}${u.changed ? `<b>${u.changed}</b> changed since you read them` : ''}`
    : 'all of it read, none changed since';

  requestAnimationFrame(() => { fit(); pagemap(); });
  const crumbs = [];
  for (let i=0;i<=PATH.length;i++) {
    const n = at(PATH.slice(0,i));
    crumbs.push(i === PATH.length ? `<span>${esc(n.name)}</span>` : `<a data-go="${i}">${esc(n.name)}</a>`);
  }
  document.getElementById('crumb').innerHTML = crumbs.join('<span class=\"sep\">/</span>');
  document.getElementById('title').textContent = focus.name;
  document.getElementById('meta').textContent =
    `${focus.kind} · ${fmt(tok(focus.own_n))} tokens here` +
    (focus.kids.length ? ` · ${focus.kids.length} beneath, ${fmt(tok(focus.total_n - focus.own_n))} in them` : ' · nothing beneath') +
    (focus.path && focus.path !== '.' ? ` · ${focus.path}` : '');
  const heavy = (focus.paras||[]).filter(n=>n>500).length;
  document.getElementById('weigh').innerHTML = focus.paras && focus.paras.length
    ? texture(focus.paras) + `<span>${focus.paras.length} paragraph${focus.paras.length>1?'s':''}` +
      (heavy ? ` · ${heavy} over five hundred characters` : ' · none heavy') + `</span>` : '';
  document.getElementById('prose').innerHTML = md(focus.own);
  const backs = pointedFrom(focus);
  document.getElementById('backs').innerHTML = backs.length
    ? `<span class="lbl">pointed at from</span>` + backs.map(b => {
        const p = pathOf(b);
        return `<a data-jump="${p.join(',')}">${esc(b.name)}</a>`; }).join('') : '';
  const max = Math.max(1, ...focus.kids.map(k=>k.total_n));
  const card = (k, i) => {
    const rooms = k.kids.length ? `<div class="rooms">` + k.kids.map(g =>
      `<span class="room ${g.kids.length ? 'deep' : ''}"><b>${esc(g.name)}</b><i>${fmt(tok(g.total_n))}</i></span>`).join('') + `</div>` : '';
    return `<div class="kid" data-kid="${i}">
      <div><div class="kn">${esc(k.name)}</div><div class="kf">${esc(k.face.slice(0,190))}${k.face.length>190?'…':''}</div>${rooms}</div>
      <div class="kw"><span class="o">${fmt(tok(k.total_n))}</span><div class="b"><i style="width:${100*k.total_n/max}%"></i></div>
        ${texture(k.paras, 14)}${k.kids.length ? k.kids.length + ' within' : 'a leaf'}</div></div>`;
  };
  const inner = [], beside = [];
  focus.kids.forEach((k,i) => (k.kind === 'brief' ? inner : beside).push(card(k,i)));
  document.getElementById('kids').innerHTML =
    (inner.length ? `<span class="grp">rooms of this brief</span>` + inner.join('') : '') +
    (beside.length ? `<span class="grp ${inner.length ? 'second' : ''}">standing beside it, each its own</span>` + beside.join('') : '');
}

document.getElementById('pagewrap').addEventListener('click', e => {
  const wrap = e.currentTarget, r = wrap.getBoundingClientRect();
  const f = (e.clientY - r.top) / Math.max(1, r.height);
  window.scrollTo({top: f * document.documentElement.scrollHeight - window.innerHeight/2, behavior:'smooth'});
  e.stopPropagation();
});
document.addEventListener('click', e => {
  const jump = e.target.closest('[data-jump]');
  if (jump) { go(jump.dataset.jump.split(',').filter(x=>x!=='').map(Number)); return; }
  const a = e.target.closest('.prose a[href], .backs a');
  if (a) {
    const t = resolve(a.getAttribute('href'), at(PATH).path);
    if (t) { e.preventDefault(); const p = pathOf(t); if (p) go(p); return; }
  }
  const kid = e.target.closest('.kid'), up = e.target.closest('[data-go]'), arc = e.target.closest('[data-path]');
  if (kid) { go(PATH.concat(Number(kid.dataset.kid))); }
  else if (up) { go(PATH.slice(0, Number(up.dataset.go))); }
  else if (e.target.closest('.mn')) { const d = e.target.closest('.mn').dataset.path;
    go(d ? d.split(',').map(Number) : []); }
  else if (arc && arc.dataset.path) { go(PATH.concat(arc.dataset.path.split(',').map(Number))); }
});

async function load() {
  const d = await (await fetch('/tree')).json();
  const first = !DATA;
  DATA = d;
  if (first) {
    const h = (location.hash || '').replace('#','').split('.').filter(x=>x!=='').map(Number);
    try { at(h); PATH = h; } catch (e) { PATH = []; }
    render();
  }
  else { try { at(PATH); } catch (e) { PATH = []; } render(); }
}
load(); setInterval(load, 5000);
</script>
</body>
