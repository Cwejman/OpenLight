<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* One ground, no panels. Ink is spent only where a fact pays for it:
     rest has none, identity takes one edge, attention is transient, state is summoned. */
  :root { color-scheme: light dark;
    --bg:#f2ede3; --ink:#1e1b17; --soft:#463f37; --mute:#857d71; --line:#ded4c2;
    --seq:#3d6fb0; --warm:#b8542a;
    /* six hues, one per region of the whole, assigned in fixed order and never cycled;
       validated for this ground, for colour blindness and for contrast */
    --h1:#3d6fb0; --h2:#b8542a; --h3:#2f8f62; --h4:#7a5aa8; --h5:#a07a18; --h6:#a8476b;
    /* rhythm: one magnitude at depth 0, stepping down per level, with a floor */
    --r0: clamp(22px, 2.4vw, 40px); --r1: calc(var(--r0) * .62); --r2: calc(var(--r1) * .62);
    --r3: calc(var(--r2) * .66); --r4: 4px;
    /* six sizes, absolute under nesting; role is importance, never depth */
    --t1: clamp(30px, 3.4vw, 46px); --t2: clamp(20px, 1.6vw, 24px); --t3: clamp(18px, 1.35vw, 21px);
    --t4: clamp(16px, 1.1vw, 17.5px); --t5: 14.5px; --t6: 11px;
    --serif: "Newsreader", Georgia, serif; --sans: "Inter", system-ui, sans-serif;
    /* a summoned surface: lifted a little off the ground, its edge diffused rather than drawn */
    --lift: color-mix(in oklab, var(--bg) 92%, #fff 8%); --sheen: rgba(255,255,255,.5);
    --diffuse-1: rgba(40,30,16,.06); --diffuse-2: rgba(40,30,16,.26); }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#141317; --ink:#efeae0; --soft:#cdc6ba; --mute:#8f887d; --line:#312e38;
    --seq:#6a9be0; --warm:#e58a5a;
    --h1:#5b8fd6; --h2:#d4703c; --h3:#2ba36b; --h4:#9a7ed0; --h5:#b08c22; --h6:#d05f84;
    --lift: color-mix(in oklab, var(--bg) 86%, #fff 14%); --sheen: rgba(255,255,255,.09);
    --diffuse-1: rgba(0,0,0,.34); --diffuse-2: rgba(0,0,0,.62); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font: var(--t4)/1.62 var(--serif); -webkit-font-smoothing:antialiased; }
  .wrap { display:grid; grid-template-columns: clamp(230px, 21vw, 370px) minmax(0, 1fr);
    gap: var(--r0); min-height:100vh; padding: var(--r1) var(--r0) var(--r0); }
  @media (max-width: 900px) { .wrap { grid-template-columns:1fr; } .map { position:static !important; height:auto !important; } }

  /* the maps: they sit on the ground, they are not a panel */
  .map { position:sticky; top:var(--r1); height:calc(100vh - var(--r0) * 1.6);
    display:flex; flex-direction:column; overflow:hidden; }
  .root { font: 600 var(--t2)/1.2 var(--serif); margin:0 0 2px; letter-spacing:-.012em; }
  .sub { font: var(--t6)/1.5 var(--sans); color:var(--mute); letter-spacing:.06em; text-transform:uppercase; }
  .map::-webkit-scrollbar { display:none; }
  .wid { flex:0 0 auto; display:flex; flex-direction:column; min-height:0; }
  .wid.grow { flex:1 1 auto; }
  .wid.off .body { display:none; }
  .wid.off { flex:0 0 auto; }
  .wid > .body { min-height:0; display:flex; flex-direction:column; }
  .lbl { font: 500 10px/1 var(--sans); letter-spacing:.15em; text-transform:uppercase;
    color:var(--mute); display:block; margin:var(--r1) 0 var(--r3); cursor:pointer; }
  .wid > .lbl::after { content:" —"; color:var(--line); }
  .wid.off > .lbl::after { content:" +"; }
  .wid > .lbl:hover { color:var(--ink); }
  svg { display:block; width:100%; height:auto; }
  svg path { cursor:pointer; transition:opacity .12s; }
  svg path:hover { opacity:.72; }

  .dirs { flex:0 1 auto; min-height:80px; max-height:24vh; overflow-y:auto; margin:0 0 var(--r2); }
  .dr { display:flex; align-items:baseline; gap:0; font: 13px/1.65 var(--sans); color:var(--mute); }
  .dr.read { opacity:.55; } .dr.changed a { color:var(--warm); }
  .dr.on > a { color:var(--ink); font-weight:500; }
  .dr a { color:var(--soft); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dr a:hover, .dr.lit a { color:var(--seq); }
  .dr .tw { width:12px; flex:none; cursor:pointer; color:var(--mute); font-size:9px; }
  .dr .w { margin-left:auto; padding-left:8px; font-size:10px; font-variant-numeric:tabular-nums; flex:none; }
  .dr .dot { width:5px; height:5px; margin-right:6px; }
  .trail { margin:var(--r2) 0 0; font: var(--t5)/1.5 var(--serif); }
  .trail a { color:var(--mute); cursor:pointer; }
  .trail a:hover, .trail a.lit { color:var(--seq); }
  .trail a.now { color:var(--ink); }
  .trail .sep { color:var(--line); margin:0 5px; }
  .trail .back { float:right; font: 10px/1.6 var(--sans); letter-spacing:.1em;
    text-transform:uppercase; color:var(--mute); }
  .place { margin:var(--r2) 0 0; }
  .place .lvl { padding-left:0; margin-bottom:var(--r4); }
  .place .lvl + .lvl { padding-left:10px; }
  .place .lvl + .lvl + .lvl { padding-left:20px; }
  .place .lvl + .lvl + .lvl + .lvl { padding-left:30px; }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:7px;
    vertical-align:1px; flex:none; }
  .place .nm { font: var(--t5)/1.35 var(--serif); color:var(--mute); cursor:pointer;
    display:inline-block; max-width:78%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    vertical-align:bottom; }
  .place .lvl.now .nm { color:var(--ink); font-weight:600; }
  .place .nm:hover, .place .nm.lit { color:var(--seq); }
  .place .w { font: 10px/1.4 var(--sans); color:var(--mute); float:right;
    font-variant-numeric:tabular-nums; }
  .place .row { display:flex; gap:2px; height:5px; margin:3px 0 var(--r3); }
  .place .row i { display:block; background:var(--line); cursor:pointer; min-width:2px; }
  .place .row i.on { background:var(--warm); }
  .place .row i.been { background:color-mix(in oklab, var(--seq) 55%, var(--line)); }
  .place .row i:hover, .place .row i.lit { background:var(--seq) !important; }

  .gauge { margin:var(--r2) 0 0; }
  .gauge .bar { display:flex; gap:2px; height:16px; }
  .gauge .bar i { display:block; }
  .gauge table { width:100%; border-collapse:collapse; font: 12.5px/1.7 var(--sans); margin-top:var(--r3); }
  .gauge td { padding:0; color:var(--mute); }
  .gauge td.n { text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
  .gauge td.c { text-align:right; font-variant-numeric:tabular-nums; }
  .gauge i.sw { display:inline-block; width:8px; height:8px; margin-right:8px; vertical-align:0; }
  .note { font: var(--t6)/1.6 var(--sans); color:var(--mute); margin-top:var(--r4); }
  .unread { font: var(--t6)/1.6 var(--sans); color:var(--mute); letter-spacing:.05em; }
  .unread b { color:var(--warm); font-weight:500; }
  .readbar { display:flex; gap:2px; height:4px; margin:var(--r4) 0 0; }
  .readbar i { display:block; }

  .miniwrap { flex:1 1 auto; position:relative; overflow:hidden; margin-top:var(--r3); min-height:110px; }
  .cellwrap { flex:1 1 auto; }
  #pagewrap { flex:0 0 30px; margin-top:var(--r3); }
  .cells { position:absolute; inset:0; }
  .cells .c { position:absolute; border:.5px solid var(--bg); transition:opacity .12s; }
  .cells .c.read { opacity:.4; }
  .cells .c.changed { box-shadow:inset 0 0 0 1px var(--warm); }
  .cells .c.here { outline:1.5px solid var(--warm); outline-offset:-1.5px; border-radius:3px; z-index:40;
    box-shadow:0 0 10px -1px color-mix(in oklab, var(--warm) 45%, transparent); }
  .cells .c.lit { outline:2px solid var(--seq); outline-offset:-2px; border-radius:3px; z-index:50;
    box-shadow:0 0 12px -1px color-mix(in oklab, var(--seq) 45%, transparent); }
  .cells .c.within { outline:1.5px dashed var(--seq); outline-offset:-2px; border-radius:3px; z-index:45;
    box-shadow:0 0 10px -2px color-mix(in oklab, var(--seq) 34%, transparent); }
  .cells .c span { position:absolute; left:3px; top:1px; right:2px; overflow:hidden;
    font: 9px/1.3 var(--sans); color:var(--ink); opacity:.6; white-space:nowrap; pointer-events:none; }
  .cells .c .own { position:absolute; left:0; top:0; background:var(--ink); opacity:.13; pointer-events:none; }
  .cells .c.more { background-image:repeating-linear-gradient(135deg,
    color-mix(in oklab, var(--ink) 13%, transparent) 0 1px, transparent 1px 4px); }
  .pagemap { position:absolute; inset:0; }
  .pagemap i { position:absolute; display:block; }
  .view { position:absolute; border-radius:5px;
    background:color-mix(in oklab, var(--warm) 12%, transparent);
    box-shadow:0 0 0 1px color-mix(in oklab, var(--warm) 40%, transparent),
               0 0 14px -2px color-mix(in oklab, var(--warm) 30%, transparent); pointer-events:none; }
  .mini { position:absolute; inset:0 0 auto 0; transform-origin:top left; }
  .mn { padding:0 0 6px; cursor:pointer; border-left:2px solid transparent; }
  .mn.read { opacity:.42; } .mn.changed { border-left-color:var(--warm); }
  .mn.lit { border-left-color:var(--seq); }
  .mh { height:3px; margin:0 0 3px; } .mp { margin:0 0 2.5px; }
  .mp .ln { height:1px; margin-bottom:1px; } .mp.big .ln { background:var(--warm) !important; }
  .cursor { position:absolute; left:0; right:0; border-radius:5px;
    background:color-mix(in oklab, var(--warm) 9%, transparent);
    box-shadow:0 0 0 1px color-mix(in oklab, var(--warm) 34%, transparent),
               0 0 12px -2px color-mix(in oklab, var(--warm) 26%, transparent); pointer-events:none; }
  .caret { position:absolute; left:0; right:0; height:2px; background:var(--warm); pointer-events:none; }

  /* depth runs to the right: one spread per level, the ones behind kept and readable */
  .doc { padding:0; overflow:hidden; display:flex; flex-direction:column;
    height:calc(100vh - var(--r0) * 1.6); }
  .rail { display:flex; align-items:baseline; flex-wrap:wrap; gap:0 6px; flex:none;
    font: var(--t6)/1.7 var(--sans); letter-spacing:.08em; text-transform:uppercase;
    color:var(--mute); padding-bottom:var(--r3); }
  .rail a { color:var(--mute); cursor:pointer; white-space:nowrap; }
  .rail a.shown { color:var(--soft); }
  .rail a.now { color:var(--ink); font-weight:500; }
  .rail a:hover, .rail a.lit { color:var(--seq); }
  .rail .sep { color:var(--line); }
  .rail .sep.file { color:var(--mute); font-weight:500; }
  .rail .dot { width:5px; height:5px; margin-right:5px; vertical-align:0; }
  .panes { display:grid; gap:calc(var(--r0) * 1.2); overflow:hidden; flex:1 1 auto; min-height:0; }
  .pane { min-width:0; height:100%; overflow-y:auto; scrollbar-width:none;
    padding-bottom:14vh; opacity:.72; transition:opacity .18s; }
  .pane::-webkit-scrollbar { display:none; }
  .pane.last, .pane:hover { opacity:1; }
  .pane.ahead { opacity:.9; }
  .pane.ahead.empty { opacity:.5; }
  .waiting { font: var(--t6)/1.7 var(--sans); color:var(--mute); letter-spacing:.08em;
    text-transform:uppercase; padding-top:var(--r4); }
  .pane.ahead .ptitle { font-size:var(--t2); }
  .pane.ahead::before { content:"ahead"; display:block; font: 500 10px/1 var(--sans);
    letter-spacing:.15em; text-transform:uppercase; color:var(--warm); margin-bottom:var(--r3); }
  .phead { position:sticky; top:0; z-index:2; padding-bottom:var(--r3);
    background:linear-gradient(var(--bg) 76%, transparent); }
  .ptitle { font:600 var(--t2)/1.2 var(--serif); margin:0 0 var(--r4); letter-spacing:-.014em; cursor:pointer; }
  .pane.last .ptitle { font-size:var(--t1); line-height:1.1; letter-spacing:-.022em; margin-bottom:var(--r3); }
  .ptitle:hover, .ptitle.lit { color:var(--seq); }
  .pmeta { font:var(--t6)/1.6 var(--sans); color:var(--mute); letter-spacing:.08em;
    text-transform:uppercase; margin-bottom:var(--r3); }
  .pane .prose { max-width:none; padding-bottom:var(--r1); }
  .pane:not(.last) .prose { font-size:var(--t5); }
  .pane:not(.last) .prose > p:first-child { font-size:var(--t4); }
  /* the room you went into, marked so it cannot be missed */
  .kid.chosen { position:relative; }
  .kid.chosen::before { content:""; position:absolute; left:-16px; right:-12px; top:-6px; bottom:var(--r2);
    background:color-mix(in oklab, var(--warm) 11%, transparent); border-left:3px solid var(--warm);
    border-radius:0 6px 6px 0; pointer-events:none; }
  .kid.chosen .kn { color:var(--ink); }
  /* each spread's own division: this level's rooms, weighted */
  .plocal { display:flex; gap:2px; height:9px; margin:0 0 var(--r3); }
  .plocal i { display:block; background:var(--line); cursor:pointer; min-width:2px; border-radius:1px; }
  .plocal i.on { background:var(--warm); }
  .plocal i.been { background:color-mix(in oklab, var(--seq) 50%, var(--line)); }
  .plocal i:hover, .plocal i.lit { background:var(--seq) !important; }
  /* the page */
  .doc { padding-bottom:22vh; }
  .crumb { font: var(--t6)/1.7 var(--sans); color:var(--mute); margin-bottom:var(--r2);
    letter-spacing:.08em; text-transform:uppercase; }
  .crumb a { color:var(--soft); text-decoration:none; cursor:pointer; }
  .crumb a:hover { color:var(--seq); }
  .crumb span.sep { margin:0 8px; color:var(--line); }
  .title[data-uid] { cursor:default; }
  .title.lit, .meta.lit { color:var(--seq); }
  .title { font: 600 var(--t1)/1.1 var(--serif); margin:0 0 var(--r3); letter-spacing:-.022em; max-width:17em; }
  .meta { font: var(--t6)/1.6 var(--sans); color:var(--mute); letter-spacing:.08em;
    text-transform:uppercase; margin-bottom:var(--r3); }
  .weigh { display:flex; align-items:center; gap:14px; margin:0 0 var(--r1);
    font: var(--t6)/1.6 var(--sans); color:var(--mute); letter-spacing:.06em; text-transform:uppercase; }
  .weigh .tex { height:18px; margin:0; }
  .tex { display:flex; gap:2px; align-items:flex-end; height:16px; margin:var(--r4) 0 0; }
  .tex i { display:block; width:3px; background:var(--line); }
  .tex i.big { background:var(--warm); }
  .kw .tex { justify-content:flex-end; height:12px; }
  .spark { display:inline-flex; gap:1.5px; align-items:flex-end; height:10px; margin-left:8px; vertical-align:-1px; }
  .spark i { display:block; width:2px; background:var(--line); }
  .spark i.big { background:var(--warm); }
  .crumb .spark { height:8px; margin-left:6px; }

  .prose { max-width:36em; }
  .prose > p:first-child { font-size:var(--t3); line-height:1.55; color:var(--ink); margin-bottom:var(--r2); }
  .prose p { margin:0 0 1.05em; color:var(--soft); }
  .prose h3 { font: 600 var(--t2)/1.26 var(--serif); color:var(--ink); margin:var(--r0) 0 var(--r3); letter-spacing:-.012em; }
  .prose h4 { font: 500 var(--t6)/1.4 var(--sans); color:var(--mute); letter-spacing:.14em;
    text-transform:uppercase; margin:var(--r1) 0 var(--r3); }
  .prose ul, .prose ol { margin:0 0 1.1em; padding-left:1.1em; color:var(--soft); }
  .prose li { margin:0 0 .55em; }
  .prose strong { font-weight:600; color:var(--ink); }
  .prose code { font: .88em/1.4 ui-monospace, Menlo, monospace;
    background:color-mix(in oklab, var(--ink) 6%, transparent); padding:0 4px; }
  .prose pre { background:color-mix(in oklab, var(--ink) 5%, transparent); padding:var(--r3) var(--r2);
    overflow-x:auto; font: 13px/1.55 ui-monospace, Menlo, monospace; }
  .prose blockquote { margin:var(--r2) 0; padding-left:16px; border-left:2px solid var(--line);
    color:var(--mute); font-style:italic; }
  .prose a { color:var(--seq); text-decoration:none;
    border-bottom:1px solid color-mix(in oklab, var(--seq) 32%, transparent); }
  .prose a.empty { color:var(--mute); border-bottom:1px dotted var(--line); }
  .prose a.out { border-bottom-style:dashed; }
  .prose a.lit { color:var(--warm); border-bottom-color:var(--warm); }

  .backs { margin-top:var(--r0); }
  .backs a { display:inline-block; font: var(--t5)/1.5 var(--serif); color:var(--soft);
    margin:0 var(--r2) var(--r4) 0; cursor:pointer; }
  .backs a:hover { color:var(--seq); }

  /* what lies beneath: rhythm groups it, nothing encloses it */
  .kids { margin-top:var(--r0); }
  .kids .grp, .pane .grp { font: 500 10px/1 var(--sans); letter-spacing:.15em; text-transform:uppercase;
    color:var(--mute); display:block; margin:calc(var(--r0) * 1.5) 0 var(--r1); }
  .kid { display:grid; grid-template-columns:minmax(0,1fr) 78px; gap:var(--r2);
    align-items:baseline; padding:var(--r3) 0 var(--r1); cursor:pointer; }
  .kid > div { min-width:0; }
  @media (min-width: 1240px) {
    /* the estate a card takes follows what it holds, not the width available */
    .kid { grid-template-columns:minmax(0,1fr) 104px; max-width:62em; }
  }
  .kn .dot { width:7px; height:7px; vertical-align:2px; margin-right:9px; }
  .kn { font: 600 var(--t3)/1.28 var(--serif); letter-spacing:-.012em; transition:color .12s; max-width:22em; }
  .pane.last .kn { font-size:var(--t2); }
  .kid:hover .kn { color:var(--seq); }
  .kf { color:var(--mute); font: var(--t5)/1.5 var(--serif); margin-top:var(--r4); max-width:34em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  /* the room ahead is the one that shows itself whole */
  .pane.ahead .kf { -webkit-line-clamp:2; }
  .pane.ahead .prose { font-size:var(--t4); }
  .pane:not(.ahead):not(.last) .kf { -webkit-line-clamp:1; }
  .rooms { margin:var(--r3) 0 0; padding-left:14px; border-left:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:2px var(--r2); }
  .room { font: var(--t5)/1.6 var(--serif); color:var(--mute); white-space:nowrap; cursor:pointer; }
  .room b { font-weight:400; color:var(--soft); }
  .room i { font-style:normal; font: 10.5px/1 var(--sans); color:var(--mute); margin-left:7px;
    font-variant-numeric:tabular-nums; }
  .room.deep b { color:var(--ink); }
  .room.deep::before { content:"›"; color:var(--line); margin-right:5px; }
  .room:hover b { color:var(--seq); }
  .kw { font: 10.5px/1.5 var(--sans); color:var(--mute); text-align:right;
    letter-spacing:.06em; text-transform:uppercase; }
  .kw .o { display:block; font: var(--t5)/1.3 var(--serif); letter-spacing:0; text-transform:none;
    color:var(--ink); font-variant-numeric:tabular-nums; }
  .kw .b { height:3px; background:var(--line); margin:var(--r4) 0; overflow:hidden; }
  .kw .b i { display:block; height:100%; background:var(--seq); }

  /* summoned: present only while the pointer asks */
  /* the ground shows through: the page is not recoloured, only gathered and softened */
  .tip { position:fixed; z-index:9; pointer-events:none; display:none; max-width:340px;
    background:color-mix(in oklab, var(--bg) 58%, transparent);
    -webkit-backdrop-filter:blur(22px) saturate(1.2); backdrop-filter:blur(22px) saturate(1.2);
    border-radius:18px; padding:var(--r2) calc(var(--r2) + 4px); border:0; box-shadow:none;
    -webkit-mask-image:radial-gradient(115% 130% at 50% 50%, #000 74%, transparent 100%);
    mask-image:radial-gradient(115% 130% at 50% 50%, #000 74%, transparent 100%);
    animation:rise .14s ease-out; }
  @keyframes rise { from { opacity:0; } }
  .tip.pinned { pointer-events:auto;
    background:color-mix(in oklab, var(--bg) 56%, color-mix(in oklab, var(--warm) 22%, transparent)); }
  @supports not (backdrop-filter: blur(4px)) { .tip { background:var(--lift); } }
  .tip .t { font: 600 var(--t5)/1.3 var(--serif); color:var(--ink); }
  .tip .f { font: var(--t5)/1.45 var(--serif); color:var(--mute); margin-top:var(--r4); }
  .tip .s { font: 10.5px/1.7 var(--sans); color:var(--mute); margin-top:var(--r3);
    letter-spacing:.06em; text-transform:uppercase; }
  .tip .s b { color:var(--ink); font-weight:500; }
  .tip .s em { font-style:normal; color:var(--warm); }
  .tip .act { margin-top:var(--r3); display:flex; flex-wrap:wrap; gap:2px var(--r2); }
  .tip .act a { font: var(--t5)/1.5 var(--serif); color:var(--soft); cursor:pointer; }
  .tip .act a:hover { color:var(--seq); }
  .tip .act a.open { color:var(--warm); font-weight:500; }
  .tip .hint { font: 10px/1.5 var(--sans); color:var(--mute); letter-spacing:.1em;
    text-transform:uppercase; margin-top:var(--r3); }
  [data-uid] { cursor:pointer; }
  svg path.lit, svg circle.lit { stroke:var(--seq) !important; stroke-width:2 !important; }
  svg path.athere { stroke:var(--warm) !important; stroke-width:2 !important; }

  .room.lit i, .place i.lit { background:var(--seq); }
  .place i.lit { background:var(--seq) !important; }

</style>
</head>
<body>
<div class="tip" id="tip"></div>
<div class="wrap">
  <aside class="map">
    <h1 class="root" id="rootname">reading…</h1>
    <div class="sub" id="rootsub"></div>
    <section class="wid" data-w="place"><span class="lbl">where you are, from the root</span>
      <div class="body"><div class="place" id="place"></div></div></section>
    <section class="wid" data-w="trail"><span class="lbl">where you have been</span>
      <div class="body"><div class="trail" id="trail"></div></div></section>
    <section class="wid" data-w="sun"><span class="lbl">the rooms of here</span>
      <div class="body"><div id="sun"></div></div></section>
    <section class="wid" data-w="gauge"><span class="lbl">what stopping at each level costs</span>
      <div class="body"><div class="gauge" id="gauge"></div></div></section>
    <section class="wid" data-w="dirs"><span class="lbl">the files, as they lie</span>
      <div class="body"><div class="dirs" id="dirs"></div></div></section>
    <section class="wid grow" data-w="cells"><span class="lbl">the whole, divided as it divides</span>
      <div class="body"><div class="unread" id="unread"></div><div class="readbar" id="readbar"></div>
        <div class="miniwrap cellwrap"><div class="cells" id="cells"></div></div></div></section>
    <section class="wid" data-w="page"><span class="lbl">this page, as you scroll it</span>
      <div class="body"><div class="miniwrap" id="pagewrap"><div class="pagemap" id="pagemap"></div>
        <div class="view" id="view" hidden></div></div></div></section>
  </aside>
  <main class="doc"><div class="rail" id="rail"></div><div class="panes" id="panes"></div></main>
</div>
<script>
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tok = n => Math.round(n/4);
const fmt = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1)+'k' : String(n);
const shade = d => `color-mix(in oklab, var(--seq) ${Math.max(16, 96 - d*20)}%, var(--bg))`;
// hue says which region of the whole a brief belongs to; depth says how far in it sits
const HUES = 6;
function hueOf(uid) {
  const first = uid === '' ? -1 : Number(String(uid).split(',')[0]);
  return first < 0 ? 'var(--mute)' : `var(--h${(first % HUES) + 1})`;
}
function tint(uid, depth) {
  return `color-mix(in oklab, ${hueOf(uid)} ${Math.max(14, 88 - depth * 19)}%, var(--bg))`;
}
function dot(uid) { return `<i class="dot" style="background:${hueOf(uid)}"></i>`; }
let DATA = null, PATH = [];   // PATH = indices from the root to the focused node

function at(path) { let n = DATA.tree; for (const i of path) n = n.kids[i]; return n; }
function md(src) {
  const lines = (src||'').split('\n'); let out = '', buf = [], list = null;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]*)\)/g, (m,a,b) => b ? `<a href="${esc(b)}" target="_blank" rel="noopener">${a}</a>` : `<a class="empty">${a}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const flushP = () => { if (buf.length) { out += `<p>${inline(buf.join(' '))}</p>`; buf = []; } };
  const flushL = () => { if (list) { out += `</${list}>`; list = null; } };
  let code = false;
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (l.startsWith('```')) { flushP(); flushL(); out += code ? '</code></pre>' : '<pre><code>'; code = !code; continue; }
    if (code) { out += esc(raw) + '\n'; continue; }
    if (!l.trim()) { flushP(); flushL(); continue; }
    let m;
    if ((m = l.match(/^(#{3,6})\s+(.*)$/))) { flushP(); flushL(); const h = Math.min(m[1].length, 4); out += `<h${h}>${inline(m[2])}</h${h}>`; continue; }
    if ((m = l.match(/^[-*]\s+(.*)$/))) { flushP(); if (list !== 'ul') { flushL(); out += '<ul>'; list='ul'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\d+\.\s+(.*)$/))) { flushP(); if (list !== 'ol') { flushL(); out += '<ol>'; list='ol'; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^>\s?(.*)$/))) { flushP(); flushL(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    buf.push(l);
  }
  flushP(); flushL(); if (code) out += '</code></pre>';
  return out;
}

function index(root) {
  const byPath = {}, byKey = {};
  (function w(n){ if ((n.kind === 'file' || n.kind === 'folder') && !byPath[n.path]) byPath[n.path] = n;
    if (n.anchor) byKey[n.path + '#' + n.anchor] = n; n.kids.forEach(w); })(root);
  return {byPath, byKey};
}
const OPEN = new Set();
function base(n) {
  const p = n.path || '';
  const b = p.split('/').filter(Boolean).pop() || p;
  return n.kind === 'folder' ? b + '/' : b;
}
function dirtree() {
  const rows = [];
  (function walk(n, depth, path) {
    n.kids.forEach((k, i) => {
      if (k.kind !== 'file' && k.kind !== 'folder') return;
      const uid = path.concat(i).join(',');
      const onPath = PATH.slice(0, path.length + 1).join(',') === uid;
      const open = OPEN.has(uid) || onPath;
      const sub = k.kids.some(x => x.kind === 'file' || x.kind === 'folder');
      rows.push(`<div class="dr ${onPath ? 'on' : ''} ${trait(k)}" style="padding-left:${depth * 11}px" data-uid="${uid}">
        <span class="tw">${sub ? (open ? '▾' : '▸') : ''}</span>${dot(uid)}<a data-jump="${uid}">${esc(base(k))}</a>
        <span class="w">${fmt(tok(k.total_n))}</span></div>`);
      if (open) walk(k, depth + 1, path.concat(i));

}
function placement() {
  const root = DATA.tree;
  const rows = [];
  for (let i = 0; i <= PATH.length; i++) {
    const here = at(PATH.slice(0, i));
    const nm = here.name.replace(/^[\d.]+\s*/, '');
    const last = i === PATH.length;
    rows.push(`<div class="lvl ${last ? 'now' : ''}">
      <a class="nm" data-jump="${PATH.slice(0, i).join(',')}" data-uid="${PATH.slice(0, i).join(',')}">${
        i ? dot(PATH.slice(0, i).join(',')) : ''}${esc(nm)}</a>
      <span class="w">${fmt(tok(here.own_n))}${here.kids.length ? ` + ${fmt(tok(here.total_n - here.own_n))}` : ''}</span>` +
      (last || !here.kids.length ? '' : (() => {
        const tot = here.kids.reduce((a,k)=>a+Math.max(k.total_n,1),0) || 1;
        return `<div class="row">` + here.kids.map((k,j) => {
          const uid = PATH.slice(0, i).concat(j).join(',');
          const on = j === PATH[i], been = TRAIL.indexOf(uid) >= 0;
          return `<i class="${on ? 'on' : ''} ${been && !on ? 'been' : ''}" data-uid="${uid}"
            style="flex:${Math.max(k.total_n,1)/tot}"></i>`;
        }).join('') + `</div>`;
      })()) + `</div>`);
  }
  return rows.join('');
}
function sunburst(focus, basePath) {
  const deep = (function d(n){ return n.kids.length ? 1 + Math.max(...n.kids.map(d)) : 0; })(focus);
  const RINGS = Math.max(1, Math.min(7, deep)), R0 = 34, RING = Math.max(16, Math.min(30, 150 / RINGS));
  const S = (R0 + RINGS*RING + 6) * 2, c = S/2;
  const arc = (r0, r1, a0, a1) => {
    if (a1 - a0 > 6.2829) a1 = a0 + 6.2829;
    const p = (r,a) => [c + r*Math.cos(a), c + r*Math.sin(a)];
    const [x0,y0]=p(r0,a0),[x1,y1]=p(r1,a0),[x2,y2]=p(r1,a1),[x3,y3]=p(r0,a1);
    const big = a1-a0 > Math.PI ? 1 : 0;
    return `M${x0},${y0}L${x1},${y1}A${r1},${r1} 0 ${big} 1 ${x2},${y2}L${x3},${y3}A${r0},${r0} 0 ${big} 0 ${x0},${y0}Z`;
  };
  let out = '', placed = new Map(), IDX = index(focus);
  ANG = {}; HUB = {c, r0: R0, rmax: R0 + RINGS * RING};
  const hereKey = PATH.join(',');
  const walk = (n, depth, a0, a1, path) => {
    if (depth > RINGS || a1 - a0 < 0.003) return;
    if (depth > 0) {
      const r0 = R0 + (depth-1)*RING, r1 = r0 + RING - Math.min(2, RING/8);
      const own = n.total_n ? Math.max(0.08, n.own_n / n.total_n) : 1;
      const uid = basePath.concat(path).join(',');
      out += `<path class="${uid === hereKey ? 'athere' : ''}" d="${arc(r0, r1, a0, a1)}"
        fill="${tint(uid, depth)}" stroke="var(--bg)" stroke-width="1.5"
        data-path="${path.join(',')}" data-uid="${uid}"></path>`;
      out += `<path d="${arc(r0, r0 + (RING-2)*own, a0, a1)}" fill="var(--ink)" fill-opacity=".14" pointer-events="none"/>`;
      placed.set(n, {r: (r0+r1)/2, a: (a0+a1)/2});
      ANG[basePath.concat(path).join(',')] = {a: (a0+a1)/2, r: r1};
      const rm = (r0+r1)/2, span = (a1-a0)*rm, band = r1-r0;
      if (span > 30 && band > 12) {
        const deg = (a0+a1)/2 * 180/Math.PI, flip = deg > 90 && deg < 270;
        const room = Math.floor(span / 4.9);
        const nm = n.name.replace(/^[\d.]+\s*/, '');
        const wt = fmt(tok(n.total_n));
        const label = nm.length + wt.length + 1 <= room ? `${nm}  ${wt}`
                    : nm.length <= room ? nm
                    : wt.length <= room ? wt : '';
        if (label) out += `<text x="0" y="0" transform="translate(${c + rm*Math.cos((a0+a1)/2)},${c + rm*Math.sin((a0+a1)/2)}) rotate(${flip ? deg + 90 + 180 : deg + 90})"
          text-anchor="middle" dominant-baseline="middle" pointer-events="none"
          font-family="Inter, system-ui, sans-serif" font-size="${Math.min(9.5, band/2.6)}"
          fill="var(--ink)" fill-opacity=".72">${esc(label)}</text>`;
      }
    }
    let s = a0;
    const tot = n.kids.reduce((a,k)=>a+Math.max(k.total_n, 1), 0) || 1;
    for (let i=0;i<n.kids.length;i++) {
      const k = n.kids[i], w = (a1-a0) * Math.max(k.total_n,1)/tot;
      walk(k, depth+1, s, s+w, path.concat(i)); s += w;
    }
  };

  let chords = '';
  for (const [n, from] of placed) {
    for (const l of (n.links || [])) {
      const t = IDX.byKey[l] || IDX.byPath[l.split('#')[0]];
      const to = t && placed.get(t);
      if (!to || t === n) continue;
      const pt = (r,a) => [c + r*Math.cos(a), c + r*Math.sin(a)];
      const [x1,y1] = pt(from.r, from.a), [x2,y2] = pt(to.r, to.a);
      chords += `<path d="M${x1},${y1} Q${c},${c} ${x2},${y2}" fill="none" stroke="var(--warm)"
        stroke-width=".8" stroke-opacity=".5" pointer-events="none"/>`;
    }
  }
  const paras = focus.paras || [], pmax = Math.max(600, ...paras, 1);
  const ticks = paras.map((len, i) => {
    const a = -Math.PI/2 + (i + .5) / Math.max(1, paras.length) * Math.PI * 2;
    const r1 = R0 - 7, r0 = r1 - Math.max(2, (R0 - 20) * len / pmax);
    return `<line x1="${c + r0*Math.cos(a)}" y1="${c + r0*Math.sin(a)}"
      x2="${c + r1*Math.cos(a)}" y2="${c + r1*Math.sin(a)}"
      stroke="${len > 500 ? 'var(--warm)' : 'var(--ink)'}" stroke-opacity="${len > 500 ? .75 : .3}"
      stroke-width="1.6" pointer-events="none"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="The holarchy, each arc weighted by the text beneath it">
    <circle class="hub" cx="${c}" cy="${c}" r="${R0-4}" fill="${shade(0)}" stroke="var(--bg)" stroke-width="2"
      data-uid="${basePath.join(',')}"/>
    <circle id="progress" cx="${c}" cy="${c}" r="${R0-2.5}" fill="none" stroke="var(--warm)" stroke-width="2.5"
      stroke-linecap="round" pointer-events="none" transform="rotate(-90 ${c} ${c})"
      stroke-dasharray="${2*Math.PI*(R0-2.5)}" stroke-dashoffset="${2*Math.PI*(R0-2.5)}"/>
    <line id="needle" x1="${c}" y1="${c}" x2="${c}" y2="${c}" stroke="var(--seq)" stroke-width="1.6"
      stroke-linecap="round" opacity="0" pointer-events="none"/>
    <circle id="needletip" cx="${c}" cy="${c}" r="2.6" fill="var(--seq)" opacity="0" pointer-events="none"/>${ticks}
    <text x="${c}" y="${c - (focus.kids.length ? 5 : 0)}" text-anchor="middle" dominant-baseline="middle"
      font-family="Inter, system-ui, sans-serif" font-size="12" fill="var(--ink)"
      pointer-events="none">${fmt(tok(focus.own_n))}</text>${focus.kids.length ? `<text x="${c}" y="${c + 8}"
      text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="8.5"
      fill="var(--ink)" fill-opacity=".55" pointer-events="none">${fmt(tok(focus.total_n - focus.own_n))} in rooms</text>` : ''}${out}${chords}</svg>`;
}

function gauge(focus) {
  const acc = {}; (function w(n,d){ acc[d]=(acc[d]||0)+n.own_n; n.kids.forEach(k=>w(k,d+1)); })(focus,0);
  const ds = Object.keys(acc).map(Number).sort((a,b)=>a-b);
  const total = ds.reduce((a,d)=>a+acc[d],0) || 1;
  let cum = 0;
  const bar = ds.map(d => `<i style="width:${100*acc[d]/total}%;background:${shade(d)}" title="level ${d}"></i>`).join('');
  const rows = ds.map(d => { cum += acc[d]; return `<tr>
      <td><i class="sw" style="background:${shade(d)}"></i>${d === 0 ? 'this room' : d + ' room' + (d>1?'s':'') + ' in'}</td>
      <td class="n">${fmt(tok(acc[d]))}</td>
      <td class="c">${fmt(tok(cum))} to here</td></tr>`; }).join('');
  return `<div class="bar">${bar}</div><table>${rows}</table>
    <div class="note">tokens, counted as bytes over four</div>`;
}

function spark(n, cap) {
  const paras = n.paras || [];
  if (!paras.length) return '';
  const max = Math.max(600, ...paras);
  return `<span class="spark">` + paras.slice(0, cap || 9).map(len =>
    `<i class="${len > 500 ? 'big' : ''}" style="height:${Math.max(2, Math.round(10*len/max))}px"></i>`
  ).join('') + `</span>`;
}
function texture(paras, cap) {
  if (!paras || !paras.length) return '';
  const max = Math.max(600, ...paras), show = cap ? paras.slice(0, cap) : paras;
  return `<div class="tex">` + show.map(n =>
    `<i class="${n > 500 ? 'big' : ''}" style="height:${Math.max(2, Math.round(16*n/max))}px" title="${n} characters"></i>`
  ).join('') + `</div>`;
}
const SEEN = (() => { try { return JSON.parse(localStorage.getItem('reader.seen') || '{}'); } catch (e) { return {}; } })();
function saveSeen() { try { localStorage.setItem('reader.seen', JSON.stringify(SEEN)); } catch (e) {} }
function trait(n) { const was = SEEN[n.id]; return was === undefined ? '' : (was === n.h ? 'read' : 'changed'); }
function unreadCount(root) {
  let unread = 0, changed = 0;
  (function w(n) { const t = trait(n); if (t === '') unread++; else if (t === 'changed') changed++; n.kids.forEach(w); })(root);
  return {unread, changed};
}
function nodeAt(uid) {
  try { return at(uid === '' ? [] : uid.split(',').map(Number)); } catch (e) { return null; }
}
function tipFor(n) {
  const heavy = (n.paras||[]).filter(x=>x>500).length, t = trait(n);
  const ins = pointedFrom(n).length, outs = (n.links||[]).length;
  const bits = [];
  bits.push(`<b>${fmt(tok(n.own_n))}</b> here`);
  if (n.kids.length) bits.push(`<b>${fmt(tok(n.total_n - n.own_n))}</b> in ${n.kids.length} room${n.kids.length>1?'s':''}`);
  const under = (function c(x){ return x.kids.reduce((a,k)=>a+1+c(k),0); })(n);
  if (under > n.kids.length) bits.push(`${under} briefs under it`);
  if (n.paras && n.paras.length) bits.push(`${n.paras.length} paragraph${n.paras.length>1?'s':''}${heavy ? `, <em>${heavy} heavy</em>` : ''}`);
  if (outs) bits.push(`points at ${outs}`);
  if (ins) bits.push(`${ins} point here`);
  bits.push(t === 'changed' ? '<em>changed since you read it</em>' : t === 'read' ? 'read' : 'not read yet');
  return `<div class="t">${esc(n.name)}</div>${n.face ? `<div class="f">${esc(n.face.slice(0,150))}${n.face.length>150?'…':''}</div>` : ''}<div class="s">${bits.join(' · ')}</div>`;
}
function nearestMn(wrap, clientY) {
  const inner = wrap.querySelector('.mini');
  if (!inner) return null;
  const k = Number(inner.dataset.k || 1);
  const y = (clientY - wrap.getBoundingClientRect().top) / (k || 1);
  let best = null, bestD = Infinity;
  inner.querySelectorAll('.mn').forEach(el => {
    const a = el.offsetTop, b = a + el.offsetHeight;
    const d = y < a ? a - y : y > b ? y - b : 0;
    if (d < bestD) { bestD = d; best = el; }
  });
  return best;
}
let LIT = null, PIN = null, ANG = {}, HUB = null;
function needle(uid) {
  const l = document.getElementById('needle'), t = document.getElementById('needletip');
  if (!l || !HUB) return;
  const p = uid === null ? null : ANG[uid];
  if (!p) { l.setAttribute('opacity', 0); if (t) t.setAttribute('opacity', 0); return; }
  const c = HUB.c, r0 = HUB.r0 - 6;
  l.setAttribute('x1', c + r0 * Math.cos(p.a)); l.setAttribute('y1', c + r0 * Math.sin(p.a));
  l.setAttribute('x2', c + (p.r + 2) * Math.cos(p.a)); l.setAttribute('y2', c + (p.r + 2) * Math.sin(p.a));
  l.setAttribute('opacity', .85);
  if (t) { t.setAttribute('cx', c + (p.r + 4.5) * Math.cos(p.a)); t.setAttribute('cy', c + (p.r + 4.5) * Math.sin(p.a)); t.setAttribute('opacity', .9); }
}
function unpin() { PIN = null; const t = document.getElementById('tip'); t.classList.remove('pinned'); t.style.display = 'none'; }
function pin(uid, x, y) {
  const n = nodeAt(uid); if (!n) return;
  PIN = uid;
  const tip = document.getElementById('tip');
  const rooms = n.kids.slice(0, 8).map(k => {
    const p = pathOf(k); return `<a data-jump="${p.join(',')}">${esc(k.name)}</a>`; }).join('');
  const backs = pointedFrom(n).slice(0, 6).map(b => {
    const p = pathOf(b); return `<a data-jump="${p.join(',')}">${esc(b.name)}</a>`; }).join('');
  const up = uid === '' ? '' : `<a data-jump="${uid.split(',').slice(0,-1).join(',')}">step out</a>`;
  tip.innerHTML = tipFor(n) +
    `<div class="act"><a class="open" data-jump="${uid}">open this room</a>${up}${rooms}</div>` +
    (backs ? `<div class="act">${backs}</div>` : '') +
    `<div class="hint">click away to let go</div>`;
  tip.classList.add('pinned');
  tip.style.display = 'block';
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 12, x + 14) + 'px';
  tip.style.top = Math.min(window.innerHeight - tip.offsetHeight - 12, y + 14) + 'px';
}
document.addEventListener('mousemove', e => {
  if (PIN) return;
  const tip = document.getElementById('tip');
  const wrap = e.target.closest && e.target.closest('.miniwrap');
  const el = (wrap && wrap.querySelector('.mini')) ? nearestMn(wrap, e.clientY)
           : (e.target.closest && e.target.closest('[data-uid]'));
  if (el && el.classList && el.classList.contains('c')) { /* a cell answers for itself */ }
  const uid = el ? el.dataset.uid : null;
  if (uid !== LIT) {
    document.querySelectorAll('.lit, .within').forEach(x => x.classList.remove('lit', 'within'));
    LIT = uid;
    if (uid === null) needle(null);
    if (uid !== null) {
      const same = document.querySelectorAll(`[data-uid="${uid}"]`);
      same.forEach(x => x.classList.add('lit'));
      needle(uid);
      showAhead(uid);
      // a room deeper than the map's floor has no cell; show the room that holds it
      if (![...same].some(x => x.classList.contains('c'))) {
        const parts = uid === '' ? [] : uid.split(',');

  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 12, e.clientX + 16) + 'px';
  tip.style.top = Math.min(window.innerHeight - h - 12, e.clientY + 16) + 'px';
}, {passive:true});
function pathOf(target) {
