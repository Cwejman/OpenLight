<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The making</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark;
    --bg:#f4efe6; --paper:#fbf8f2; --ink:#221f1b; --mute:#7a7267; --line:#e4dccd;
    --live:#2f8f62; --rest:#b9b0a2; --accent:#b8542a; --cool:#3d6fb0; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#141317; --paper:#1c1b21; --ink:#ebe6dc; --mute:#948d82; --line:#2e2c34;
    --live:#5ccf93; --rest:#5a564f; --accent:#e58a5a; --cool:#7ea6e6; } }
  body { margin:0; padding:28px 20px 60px; background:var(--bg); color:var(--ink);
    font: 15px/1.55 "Newsreader", Georgia, serif; }
  .head { max-width:920px; margin:0 auto 28px; }
  .head h1 { font: 500 30px/1.15 "Newsreader", Georgia, serif; margin:0 0 6px; letter-spacing:-0.01em; }
  .head .now { font: 13px/1.5 "Inter", system-ui, sans-serif; color:var(--mute); }
  .standing { max-width:920px; margin:0 auto 34px; padding:18px 22px; background:var(--paper);
    border-left:3px solid var(--live); border-radius:0 8px 8px 0; font-size:16px; }
  .standing .lbl, .lbl { font: 500 11px/1 "Inter", system-ui, sans-serif; letter-spacing:.12em;
    text-transform:uppercase; color:var(--mute); display:block; margin-bottom:8px; }
  .rounds { max-width:920px; margin:0 auto 40px; display:flex; flex-wrap:wrap; gap:8px 18px;
    font: 13px/1.4 "Inter", system-ui, sans-serif; color:var(--mute); }
  .rounds span.now { color:var(--live); }
  .rounds span::before { content:"◦ "; } .rounds span.now::before { content:"● "; }
  .session { max-width:920px; margin:0 auto 46px; }
  .session .who { display:flex; align-items:baseline; gap:12px; font: 13px/1.4 "Inter", system-ui, sans-serif;
    color:var(--mute); margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .session .who b { color:var(--ink); font-weight:500; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--rest); display:inline-block; position:relative; top:-1px; }
  .dot.live { background:var(--live); animation:breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--live) 22%, transparent); } }
  .story { display:grid; grid-template-columns: 56px 1fr; column-gap:16px; row-gap:0; }
  .t { font: 12px/1.6 "Inter", system-ui, sans-serif; color:var(--mute); text-align:right; padding-top:3px;
    font-variant-numeric: tabular-nums; }
  .ev { padding: 3px 0 14px; border-left:1px solid var(--line); padding-left:18px; margin-left:0; position:relative; }
  .ev::before { content:""; position:absolute; left:-4px; top:10px; width:7px; height:7px; border-radius:50%;
    background:var(--line); }
  .ev.say::before { background:var(--ink); } .ev.report::before { background:var(--cool); }
  .ev.spawn::before { background:var(--accent); } .ev.write::before { background:var(--live); }
  .ev .s { font: 12.5px/1.4 "Inter", system-ui, sans-serif; color:var(--mute); }
  .ev.write .s, .ev.spawn .s { color:var(--ink); }
  .ev .q { margin-top:4px; white-space:pre-wrap; }
  .ev.say .q { font-size:16.5px; }
  .ev.report .q { color:var(--ink); border-left:2px solid var(--cool); padding-left:12px; font-size:14.5px; }
  .ev.spawn .q { font-style:italic; color:var(--mute); font-size:14px; }
  .ev.write .q { font-size:14px; color:var(--ink); opacity:.9; }
  .ev.act { padding-bottom:6px; } .ev.act .s { font-size:12px; }
  .foot { font: 12px/1.6 "Inter", system-ui, sans-serif; color:var(--mute); margin-top:6px; }
  .rest { opacity:.72; }
  details summary { cursor:pointer; font: 13px/1.4 "Inter", system-ui, sans-serif; color:var(--mute); list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  .shape { max-width:920px; margin:0 auto 40px; }
  .shape .lbl { margin-bottom:10px; }
  .shape svg { width:100%; height:auto; display:block; }
  .shape .legend { font: 12.5px/1.6 "Inter", system-ui, sans-serif; color:var(--mute); display:flex; gap:18px; flex-wrap:wrap; margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .tip { position:fixed; pointer-events:none; background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:6px 10px; font: 12.5px/1.5 "Inter", system-ui, sans-serif; color:var(--ink); display:none; max-width:320px; }
  .shape details { margin-top:8px; } .shape table { border-collapse:collapse; font: 12px/1.5 "Inter", system-ui, sans-serif; width:100%; }
  .shape td, .shape th { text-align:left; padding:2px 10px 2px 0; border-top:1px dashed var(--line); } .shape th { color:var(--mute); font-weight:500; border-top:0; }
  :root { --chg:#b8542a; --new:#3d6fb0; --same:#9a958c; }
  @media (prefers-color-scheme: dark) { :root { --chg:#d47a48; --new:#5b8fd6; --same:#6f6a62; } }
  .entries { max-width:920px; margin:0 auto 44px; }
  .entries .row { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px 22px; }
  .entry { border-top:1px solid var(--line); padding-top:10px; }
  .entry .n { font: 500 13px/1.4 "Inter", system-ui, sans-serif; color:var(--ink); }
  .entry .n i { font-style:normal; color:var(--mute); font-weight:400; }
  .entry .f { font-size:14px; color:var(--ink); margin-top:4px; }
  .entry.changed .n::before { content:"● "; color:var(--chg); } .entry.new .n::before { content:"◎ "; color:var(--new); }
  .steps { max-width:920px; margin:0 auto 40px; }
  .steps ol { list-style:none; margin:0; padding:0; }
  .steps li { padding:6px 0 6px 16px; border-left:2px solid var(--line); font-size:15px; }
  .steps li:first-child { border-left-color:var(--live); }
</style>
</head>
<body>
<div class="head"><h1>The making</h1><div class="now" id="now">connecting…</div></div>
<div id="standing"></div>
<div class="steps" id="steps"></div>
<div class="rounds" id="rounds"></div>
<div class="shape" id="shape"></div>
<div class="entries" id="entries"></div>
<div class="tip" id="tip"></div>
<div id="sessions"></div>
<script>
const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hm = t => t ? t.slice(11,16) : '';
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? Math.round(n/1e3)+'k' : String(n);
function story(a, hero) {
  // collapse runs of plain actions so the words carry the page
  const evs = a.events.slice(hero ? -120 : -30);
  let out = '', run = [];
  const flush = () => { if (run.length) { out += `<div class="t"></div><div class="ev act"><span class="s">${run.map(esc).join(' · ')}</span></div>`; run = []; } };
  for (const e of evs) {
    if (e.k === 'act') { run.push(e.s); continue; }
    flush();
    out += `<div class="t">${hm(e.t)}</div><div class="ev ${e.k}">${e.s ? `<span class="s">${esc(e.s)}</span>` : ''}${e.q ? `<div class="q">${esc(e.q)}</div>` : ''}</div>`;
  }
  flush();
  return out;
}
function session(a, hero) {
  const cls = a.active ? 'live' : '';
  const state = a.active ? 'working now' : `rested ${Math.round(a.idle_s/60)} min ago`;
  const body = `<div class="story">${story(a, hero)}</div>
    <div class="foot">${a.messages} turns · ${fmt(a.output)} words out · ${fmt(a.cache_r)} read from cache · ≈${a.eq_m}M</div>`;
  return `<section class="session ${hero ? '' : 'rest'}">
    <div class="who"><span class="dot ${cls}"></span><b>${esc(a.model||'')}</b><span>${a.id.slice(0,9)}</span>
      <span>${hm(a.first)}–${hm(a.last)}</span><span>${state}</span>${a.children.length ? `<span>· sent ${a.children.length} fresh head${a.children.length>1?'s':''}</span>` : ''}</div>
    ${hero ? body : `<details><summary>show</summary>${body}</details>`}</section>`;
}

// ---- the shape: the corpus as a radial holarchy, change coloured against a snapshot ----
function layout(root) {
  // leaves get equal angular share; a parent's angle spans its children
  const nodes = [];
  const count = n => n.c && n.c.length ? n.c.reduce((a,c)=>a+count(c),0) : 1;
  const walk = (n, depth, a0, a1, parent) => {
    const a = (a0+a1)/2; nodes.push({n, depth, a, parent});
    if (!n.c) return;
    let start = a0, total = count(n);
    for (const c of n.c) { const w = (a1-a0)*count(c)/total; walk(c, depth+1, start, start+w, n); start += w; }
  };
  walk(root, 0, -Math.PI/2, 1.5*Math.PI, null);
  return nodes;
}
function shape(tree, against) {
  if (!tree) return '';
  const W = 920, H = 620, cx = W/2, cy = H/2, R = [0, 92, 178, 268];
  const nodes = layout(tree);
  const maxb = Math.max(...nodes.map(d=>d.n.b||1));
  // rings breathe: a node sits a little further out the more it holds, so the levels read as organic bands
  const pos = d => { const r = R[Math.min(d.depth,3)] + (d.depth ? 22*Math.sqrt((d.n.b||1)/maxb) - 8 : 0);
    return [cx + r*Math.cos(d.a), cy + r*Math.sin(d.a)]; };
  const col = s => s==='changed' ? 'var(--chg)' : s==='new' ? 'var(--new)' : 'var(--same)';
  const byNode = new Map(nodes.map(d=>[d.n,d]));
  let links = '', marks = '', labels = '';
  for (const d of nodes) {
    if (d.parent) { const [x1,y1]=pos(byNode.get(d.parent)), [x2,y2]=pos(d);
      const mx = (x1+x2)/2 + (y1-y2)*0.12, my = (y1+y2)/2 + (x2-x1)*0.12;
      const lc = d.n.s==='same' ? 'var(--line)' : col(d.n.s);
      links += `<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" fill="none" stroke="${lc}" stroke-opacity="${d.n.s==='same'?1:.55}" stroke-width="${d.n.s==='same'?1:1.4}"/>`; }
  }
  for (const d of nodes) {
    const [x,y]=pos(d); const r = d.depth===0 ? 7 : Math.max(2.5, 13*Math.sqrt((d.n.b||1)/maxb));
    const c = col(d.n.s), ring = d.n.s==='new' ? `<circle cx="${x}" cy="${y}" r="${r+3}" fill="none" stroke="${c}" stroke-width="1.5"/>` : '';
    marks += `${ring}<circle class="m" cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="var(--bg)" stroke-width="2" data-n="${esc(d.n.n)}" data-b="${d.n.b}" data-s="${d.n.s}" data-k="${d.n.k}"/>`;
    if (d.depth===1) { const prev = nodes.filter(o=>o.depth===1 && o.a < d.a).pop();
      const tight = prev && (d.a - prev.a) * R[1] < 26; const rr = R[1] + (tight && !prev.pushed ? 34 : 18); d.pushed = rr > R[1] + 18;
      const lx = cx + rr*Math.cos(d.a), ly = cy + rr*Math.sin(d.a);
      labels += `<text x="${lx}" y="${ly}" font-size="14" font-weight="500" fill="${d.n.s==='same' ? 'var(--mute)' : col(d.n.s)}" text-anchor="${Math.cos(d.a)<-.2?'end':Math.cos(d.a)>.2?'start':'middle'}" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif">${esc(d.n.n.replace('.md',''))}</text>`; }
  }
  const counts = {same:0, changed:0, new:0}; nodes.forEach(d=>{ if (d.n.k==='brief') counts[d.n.s]++; });
  const rows = nodes.filter(d=>d.n.k!=='root' && d.n.s!=='same').map(d=>`<tr><td>${esc(d.n.k)}</td><td>${esc(d.n.n)}</td><td>${Math.round(d.n.b/4)}t</td><td>${d.n.s}</td></tr>`).join('');
  return `<span class="lbl">the shape of ${esc(tree.n)} · ${against ? 'coloured against the last snapshot' : 'no snapshot to colour against'}</span>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="The corpus as a radial tree: folders, files and briefs, sized by length, coloured by change">
      
      ${links}${marks}${labels}</svg>
    <div class="legend"><span><i style="background:var(--chg)"></i>changed since the snapshot</span><span><i style="background:var(--new);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--new)"></i>new</span><span><i style="background:var(--same)"></i>unchanged</span>
      <span>rings: folders · files · briefs</span><span>briefs: ${counts.changed} changed, ${counts.new} new, ${counts.same} unchanged</span></div>
    <details><summary>as a table</summary><table><tr><th>kind</th><th>name</th><th>size</th><th>state</th></tr>${rows}</table></details>`;
}
document.addEventListener('mousemove', e => {
  const tip = document.getElementById('tip'); const m = e.target.closest && e.target.closest('circle.m');
  if (!m) { tip.style.display='none'; return; }
  tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
  tip.textContent = `${m.dataset.k}: ${m.dataset.n} · ${Math.round(m.dataset.b/4)} tokens · ${m.dataset.s}`;
});

// ---- hospitable entries: by category, the face of each folder's entry; by change, the faces of what moved last ----
function entries(tree) {
  if (!tree) return '';
  const byCat = tree.c.map(c => {
    const entry = c.k==='folder' ? (c.c.find(f=>f.n.endsWith('README.md')) || c.c[0]) : c;
    return `<div class="entry ${c.s}"><div class="n">${esc(entry.t || c.n)} <i>· ${esc(c.n)}</i></div><div class="f">${esc(entry.f||'')}</div></div>`; }).join('');
  const moved = [];
  const walk = (n, file) => { if (n.k==='brief' && n.s!=='same') moved.push({...n, file}); (n.c||[]).forEach(k=>walk(k, n.k==='file'? n : file)); };
  walk(tree, null);
  const byChange = moved.slice(0, 8).map(m => `<div class="entry ${m.s}"><div class="n">${esc(m.n)} <i>· ${esc(m.file ? m.file.n : '')}</i></div><div class="f">${esc(m.f||'')}</div></div>`).join('');
  return `<span class="lbl">enter by category</span><div class="row">${byCat}</div>
    ${moved.length ? `<span class="lbl" style="margin-top:26px">enter by what changed last · ${moved.length} briefs</span><div class="row">${byChange}</div>` : ''}`;
}
let lastTree = '';
async function tick() {
  try {
    const s = await (await fetch('/state')).json();
    const d = s.debrief || {};
    document.getElementById('now').textContent = `${s.updated} · ${s.agents.filter(a=>a.active).length} working · ${s.agents.length} sessions in the record`;
    document.getElementById('standing').innerHTML = d.standing ? `<div class="standing"><span class="lbl">where it stands</span>${esc(d.standing)}</div>` : '';
    const tj = JSON.stringify(s.tree); if (tj !== lastTree) { lastTree = tj; document.getElementById('shape').innerHTML = shape(s.tree, s.against); document.getElementById('entries').innerHTML = entries(s.tree); }
    document.getElementById('steps').innerHTML = (d.steps && d.steps.length) ? `<span class="lbl">the steps, in the session's own words</span><ol>${d.steps.map(l=>`<li>${esc(l.replace(/^[-*]\s*/,''))}</li>`).join('')}</ol>` : '';
    document.getElementById('rounds').innerHTML = (d.rounds||[]).map((r,i,arr)=>`<span class="${i===arr.length-1?'now':''}">${esc(r)}</span>`).join('');
    const ag = s.agents.slice().sort((x,y)=> (y.active-x.active) || ((y.last||'').localeCompare(x.last||'')));
    document.getElementById('sessions').innerHTML = ag.map((a,i)=>session(a, i===0 || a.active)).join('');
  } catch (e) { document.getElementById('now').textContent = 'monitor unreachable: ' + e; }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
